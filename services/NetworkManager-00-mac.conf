# Setting the address with "ip link" is not enough: NetworkManager puts back the
# "permanent" address, and what the driver reports as permanent is the invented
# one.  Only an explicit cloned-mac-address sticks.  Replace the address below
# with the one from your own persist partition.
[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=8C:7A:3D:C0:DF:17
